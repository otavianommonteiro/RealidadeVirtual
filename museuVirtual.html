
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Museu Virtual Interativo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #titulo {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>

  <script>

    // COMPONENTE PARA ABRIR O MENU DE INFORMAÇÕES

    AFRAME.registerComponent('obra-interativa', {

      schema: {
        titulo: {type: 'string'},
        descricao: {type: 'string'}
      },

      init: function () {

        this.el.addEventListener('click', () => {

          const painel = document.querySelector('#painel');

          painel.setAttribute('visible', true);

          painel.querySelector('#textoTitulo')
            .setAttribute('value', this.data.titulo);

          painel.querySelector('#textoDescricao')
            .setAttribute('value', this.data.descricao);

        });

      }

    });

    // COMPONENTE PARA FECHAR O MENU

    AFRAME.registerComponent('fechar-painel', {

      init: function () {

        this.el.addEventListener('click', () => {

          document.querySelector('#painel')
            .setAttribute('visible', false);

        });

      }

    });

  </script>

</head>

<body>

<div id="titulo">
  MUSEU VIRTUAL 3D
  <br>
  Clique nas obras para conhecer!
</div>

<a-scene
  background="color: #eeeeee"
  vr-mode-ui="enabled: true"
  cursor="rayOrigin: mouse"
>

  <!-- ILUMINAÇÃO -->

  <a-light
    type="ambient"
    color="#ffffff"
    intensity="1">
  </a-light>

  <a-light
    type="directional"
    position="0 5 2"
    intensity="0.8">
  </a-light>

  <!-- CHÃO -->

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="14"
    height="18"
    color="#bcbcbc">
  </a-plane>

  <!-- PAREDES -->

  <a-box
    position="0 2 -8"
    width="14"
    height="4"
    depth="0.2"
    color="#ffffff">
  </a-box>

  <a-box
    position="-7 2 0"
    width="0.2"
    height="4"
    depth="16"
    color="#ffffff">
  </a-box>

  <a-box
    position="7 2 0"
    width="0.2"
    height="4"
    depth="16"
    color="#ffffff">
  </a-box>

  <!-- QUADRO 1 -->

  <a-box
    position="-4 2 -7.85"
    width="2"
    height="2"
    depth="0.08"
    color="#222222">
  </a-box>

  <a-plane
    position="-4 2 -7.79"
    width="1.7"
    height="1.7"
    color="#e74c3c"
    class="clicavel"
    obra-interativa="
      titulo: O Sol;
      descricao: O Sol é a estrela central do Sistema Solar. Sua energia é essencial para a vida na Terra.
    ">
  </a-plane>

  <a-sphere
    position="-4 2 -7.68"
    radius="0.55"
    color="#f1c40f"
    class="clicavel"
    obra-interativa="
      titulo: O Sol;
      descricao: O Sol é a estrela central do Sistema Solar. Sua energia é essencial para a vida na Terra.
    ">
  </a-sphere>

  <!-- QUADRO 2 -->

  <a-box
    position="0 2 -7.85"
    width="2"
    height="2"
    depth="0.08"
    color="#222222">
  </a-box>

  <a-plane
    position="0 2 -7.79"
    width="1.7"
    height="1.7"
    color="#3498db"
    class="clicavel"
    obra-interativa="
      titulo: Montanhas;
      descricao: As montanhas são grandes elevações naturais do terreno. Elas influenciam o clima e os ecossistemas.
    ">
  </a-plane>

  <a-triangle
    position="0 2 -7.68"
    vertex-a="0 0.6 0"
    vertex-b="-0.6 -0.5 0"
    vertex-c="0.6 -0.5 0"
    color="#ffffff"
    class="clicavel"
    obra-interativa="
      titulo: Montanhas;
      descricao: As montanhas são grandes elevações naturais do terreno. Elas influenciam o clima e os ecossistemas.
    ">
  </a-triangle>

  <!-- QUADRO 3 -->

  <a-box
    position="4 2 -7.85"
    width="2"
    height="2"
    depth="0.08"
    color="#222222">
  </a-box>

  <a-plane
    position="4 2 -7.79"
    width="1.7"
    height="1.7"
    color="#8e44ad"
    class="clicavel"
    obra-interativa="
      titulo: Arte abstrata;
      descricao: A arte abstrata utiliza formas, cores e linhas para expressar ideias e sentimentos.
    ">
  </a-plane>

  <a-torus
    position="4 2 -7.68"
    radius="0.5"
    radius-tubular="0.12"
    color="#f1c40f"
    class="clicavel"
    obra-interativa="
      titulo: Arte abstrata;
      descricao: A arte abstrata utiliza formas, cores e linhas para expressar ideias e sentimentos.
    ">
  </a-torus>

  <!-- ESCULTURA CENTRAL -->

  <a-cylinder
    position="0 0.5 -3"
    radius="0.9"
    height="1"
    color="#555555">
  </a-cylinder>

  <a-sphere
    position="0 1.8 -3"
    radius="0.8"
    color="#e67e22"
    class="clicavel"
    obra-interativa="
      titulo: Escultura central;
      descricao: Esta escultura representa uma composição geométrica tridimensional. Observe suas formas e volumes.
    "
    animation="
      property: rotation;
      to: 0 360 0;
      loop: true;
      dur: 8000">
  </a-sphere>

  <!-- PAINEL INTERATIVO -->

  <a-entity
    id="painel"
    position="0 2 -2"
    visible="false">

    <!-- Fundo -->

    <a-plane
      width="3.8"
      height="2.5"
      color="#172033"
      material="shader: flat; opacity: 0.96; transparent: true">
    </a-plane>

    <!-- Título -->

    <a-text
      id="textoTitulo"
      value="Informações"
      position="-1.65 0.85 0.02"
      width="3.3"
      color="#FFD166"
      align="left">
    </a-text>

    <!-- Descrição -->

    <a-text
      id="textoDescricao"
      value="Descrição da obra"
      position="-1.65 0.35 0.02"
      width="3.3"
      color="#ffffff"
      align="left"
      wrap-count="38">
    </a-text>

    <!-- Botão fechar -->

    <a-plane
      position="0 -0.9 0.04"
      width="1.2"
      height="0.4"
      color="#e74c3c"
      class="clicavel"
      fechar-painel>
    </a-plane>

    <a-text
      value="FECHAR"
      position="0 -0.9 0.06"
      align="center"
      anchor="center"
      width="3"
      color="#ffffff"
      class="clicavel"
      fechar-painel>
    </a-text>

  </a-entity>

  <!-- CÂMERA E CURSOR -->

  <a-entity
    position="0 1.6 4"
    camera
    look-controls
    wasd-controls>

    <a-cursor
      color="#FFD166"
      fuse="false"
      raycaster="objects: .clicavel">
    </a-cursor>

  </a-entity>

</a-scene>

</body>
</html>
