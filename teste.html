
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Teste de Cores A-Frame</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

</head>

<body>

<a-scene
  background="color: #eeeeee"
  renderer="antialias: false">

  <!-- ILUMINAÇÃO -->

  <a-light
    type="ambient"
    color="#ffffff"
    intensity="1">
  </a-light>

  <!-- CÂMERA -->

  <a-entity
    position="0 1.6 5"
    camera
    look-controls="magicWindowTrackingEnabled: false">
  </a-entity>

  <!-- ESFERA AMARELA -->

  <a-sphere
    position="-2 1.6 -3"
    radius="0.8"
    color="#f1c40f">
  </a-sphere>

  <!-- CUBO AZUL -->

  <a-box
    position="0 1.6 -3"
    width="1.5"
    height="1.5"
    depth="1.5"
    color="#3498db">
  </a-box>

  <!-- TORUS VERMELHO -->

  <a-torus
    position="2 1.6 -3"
    radius="0.7"
    radius-tubular="0.2"
    color="#e74c3c">
  </a-torus>

</a-scene>

</body>
</html>
