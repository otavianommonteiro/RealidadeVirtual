<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Minha primeira experiência VR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

  <!-- Céu -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- Chão -->
  <a-plane
    rotation="-90 0 0"
    width="30"
    height="30"
    color="#228B22">
  </a-plane>

  <!-- Cubo -->
  <a-box
    position="0 1.5 -4"
    rotation="0 45 0"
    color="#1a73e8"
    animation="
      property: rotation;
      to: 0 405 0;
      loop: true;
      dur: 5000;
    ">
  </a-box>

  <!-- Esfera -->
  <a-sphere
    position="2 1.5 -5"
    radius="0.8"
    color="#ff0000">
  </a-sphere>

  <!-- Câmera -->
  <a-entity position="0 1.6 0">
    <a-camera></a-camera>
  </a-entity>

</a-scene>

</body>
</html>
